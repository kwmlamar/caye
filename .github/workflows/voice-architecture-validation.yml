name: Voice architecture validation

on:
  push:
    branches:
      - fix/caye-communication-voice-architecture
  pull_request:
    paths:
      - 'lib/communication-realization.ts'
      - 'lib/communication-realization.test.ts'
      - 'lib/human-facing-voice.ts'
      - 'lib/human-facing-voice.test.ts'
      - 'lib/human-facing-email.ts'
      - 'lib/human-facing-email.test.ts'
      - 'lib/human-facing-boundaries.test.ts'
      - 'lib/sanitize-dashes.ts'
      - 'lib/sanitize-dashes.test.ts'
      - 'lib/email-ai.ts'
      - 'lib/whatsapp/channel-dispatch.ts'
      - 'lib/caye-agent/briefing.ts'
      - 'app/api/caye/chat/route.ts'
      - 'scripts/voice-ci-delta.py'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/caye-communication-voice-architecture
          fetch-depth: 0
      - name: Apply briefing semantic patch once
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/caye-agent/briefing.ts')
          s = p.read_text()
          old = """  const realization = buildCommunicationRealizationInstructions({
    recipientRole: 'operator',
    channel: 'proactive',
    purpose: 'informational_update',
    responseRequired: false,
    decisionRequired: false,
    previouslyMentioned: true,
    changedSinceLastMention: true,
  })

  return [
    realization,
    '',
    `You are Caye - the AI assistant ${operator} hired to handle the front desk for ${business}.`,
    '',
    `It's morning."""
          new = """  const realization = buildCommunicationRealizationInstructions({
    recipientRole: 'operator',
    channel: 'proactive',
    purpose: oldestAgingHold ? 'approval_request' : 'informational_update',
    responseRequired: Boolean(oldestAgingHold),
    decisionRequired: Boolean(oldestAgingHold),
    authorityRequirement: oldestAgingHold ? 'owner' : 'none',
    previouslyMentioned: true,
    changedSinceLastMention: true,
  })

  return [
    realization,
    '',
    `You are Caye - the AI assistant ${operator} hired to handle the front desk for ${business}.`,
    '',
    `It's morning."""
          old_offer = """      ? `- ${oldestAgingHold.customer} has been waiting ${oldestAgingHold.daysHeld} days. Surface that fact compactly, but do not manufacture an offer or question. Ask only if a real owner-only decision is required.`"""
          new_offer = """      ? `- Today is the exception to the above: ${oldestAgingHold.customer} has been waiting ${oldestAgingHold.daysHeld} days, so offer to take a first pass - \"Want me to take a first pass?\" Just the offer; never act on it without a yes.`"""
          changed = False
          if old in s:
              s = s.replace(old, new, 1); changed = True
          if old_offer in s:
              s = s.replace(old_offer, new_offer, 1); changed = True
          if changed:
              p.write_text(s)
          PY
          if git diff --quiet -- lib/caye-agent/briefing.ts; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/caye-agent/briefing.ts
          git commit -m "Preserve real aging-hold approval ask"
          git push origin HEAD:fix/caye-communication-voice-architecture
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install candidate dependencies
        run: npm ci
      - name: Focused voice tests
        run: npx vitest run lib/communication-realization.test.ts lib/human-facing-voice.test.ts lib/human-facing-email.test.ts lib/human-facing-boundaries.test.ts lib/sanitize-dashes.test.ts
      - name: Prepare current origin/main baseline
        run: |
          git fetch origin main
          git worktree add /tmp/caye-main origin/main
          cd /tmp/caye-main
          npm ci
      - name: Full tests and typecheck delta
        shell: bash
        run: |
          set +e
          python3 scripts/voice-ci-delta.py --main /tmp/caye-main --candidate "$GITHUB_WORKSPACE" 2>&1 | tee /tmp/voice-ci-delta.log
          rc=${PIPESTATUS[0]}
          {
            echo '### Voice CI delta evidence'
            echo
            echo '```text'
            grep -E '^(BASELINE:|BASELINE_ONLY_FIXED:|PR_REGRESSION:|CLEAN:|RESULT |CI DELTA GATE:)' /tmp/voice-ci-delta.log || true
            echo '```'
          } > /tmp/voice-ci-delta-summary.md
          cat /tmp/voice-ci-delta-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
      - name: Publish exact delta evidence on PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment 433 --body-file /tmp/voice-ci-delta-summary.md
      - name: Build candidate
        if: always()
        run: npm run build
