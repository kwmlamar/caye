name: Voice architecture validation

on:
  push:
    branches:
      - fix/caye-communication-voice-architecture
  pull_request:
    paths:
      - 'lib/communication-realization.ts'
      - 'lib/communication-realization.test.ts'
      - 'lib/human-facing-voice.ts'
      - 'lib/human-facing-voice.test.ts'
      - 'lib/human-facing-email.ts'
      - 'lib/human-facing-email.test.ts'
      - 'lib/human-facing-boundaries.test.ts'
      - 'lib/sanitize-dashes.ts'
      - 'lib/sanitize-dashes.test.ts'
      - 'lib/email-ai.ts'
      - 'lib/whatsapp/channel-dispatch.ts'
      - 'lib/caye-agent/briefing.ts'
      - 'app/api/caye/chat/route.ts'
      - 'scripts/voice-ci-delta.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install candidate dependencies
        run: npm ci
      - name: Focused voice tests
        run: npx vitest run lib/communication-realization.test.ts lib/human-facing-voice.test.ts lib/human-facing-email.test.ts lib/human-facing-boundaries.test.ts lib/sanitize-dashes.test.ts
      - name: Prepare current origin/main baseline
        run: |
          git fetch origin main
          git worktree add /tmp/caye-main origin/main
          cd /tmp/caye-main
          npm ci
      - name: Full tests and typecheck delta
        run: python3 scripts/voice-ci-delta.py --main /tmp/caye-main --candidate "$GITHUB_WORKSPACE"
      - name: Build candidate
        if: always()
        run: npm run build
