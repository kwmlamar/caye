name: CAY-9 validation

on:
  push:
    branches:
      - agent/cay-9-draft-intent

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Targeted CAY-9 tests
        run: >-
          npx vitest run
          lib/caye-agent/tools/external-draft-intent.test.ts
          lib/caye-agent/action-claim-guard.external-draft.test.ts
          lib/caye-agent/action-claim-guard.test.ts
          lib/caye-agent/communication-rules.test.ts
          lib/caye-agent/tools/write-high/draft-in-inbox.test.ts
          lib/caye-agent/tools/high-risk-gate.test.ts
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
