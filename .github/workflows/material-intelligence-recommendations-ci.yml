name: Material intelligence recommendations

on:
  pull_request:
    paths:
      - 'app/api/caye/research-worker/route.ts'
      - 'lib/recommendations/production.ts'
      - 'lib/recommendations/runtime.ts'
      - 'lib/recommendations/runtime.test.ts'
      - '.github/workflows/material-intelligence-recommendations-ci.yml'

jobs:
  material-intelligence-recommendations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Grounded recommendation policy
        run: npx vitest run lib/recommendations/runtime.test.ts
