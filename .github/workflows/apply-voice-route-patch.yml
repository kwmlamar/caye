name: Apply voice route patch

on:
  push:
    branches:
      - fix/caye-communication-voice-architecture

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/caye-communication-voice-architecture
      - name: Patch dashboard human-facing boundaries
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/caye/chat/route.ts')
          s = path.read_text()

          def replace_once(old, new):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:100]!r}')
              s = s.replace(old, new, 1)

          replace_once(
              "import { claimConversationExecution, completeConversationExecution, releaseConversationExecution, resolveConversationExecutionAfterFailure, validateConversationExecution } from '@/lib/conversation-execution'\n",
              "import { claimConversationExecution, completeConversationExecution, releaseConversationExecution, resolveConversationExecutionAfterFailure, validateConversationExecution } from '@/lib/conversation-execution'\nimport { HUMAN_FACING_VOICE_INSTRUCTIONS, sanitizeHumanFacingText } from '@/lib/human-facing-voice'\n",
          )

          replace_once(
              "  const { conversation_id, body } = input\n  if (!body?.trim()) return { error: 'Empty body' }\n",
              "  const { conversation_id, body } = input\n  const safeBody = sanitizeHumanFacingText(body ?? '')\n  if (!safeBody) return { error: 'Empty body' }\n",
          )
          replace_once(
              "    const result = await dispatchOperatorReply(conversation_id, body, 'caye-dashboard')\n",
              "    const result = await dispatchOperatorReply(conversation_id, safeBody, 'caye-dashboard')\n",
          )
          replace_once(
              "      preview: body.trim().slice(0, 160),\n",
              "      preview: safeBody.slice(0, 160),\n",
          )

          replace_once(
              "  const subject = input.subject?.trim()\n  const body = input.body?.trim()\n",
              "  const subject = sanitizeHumanFacingText(input.subject ?? '')\n  const body = sanitizeHumanFacingText(input.body ?? '')\n",
          )

          replace_once(
              "  return `You are Caye, the AI receptionist for ${businessName}. The person talking to you is the business OWNER, not a customer. Today's date is ${today}.\n",
              "  return `${HUMAN_FACING_VOICE_INSTRUCTIONS}\\n\\nYou are Caye, the AI receptionist for ${businessName}. The person talking to you is the business OWNER, not a customer. Today's date is ${today}.\n",
          )

          replace_once(
              "  } = {}) => {\n    const { data: inserted } = await supabase\n",
              "  } = {}) => {\n    const safeReply = sanitizeHumanFacingText(reply)\n    const { data: inserted } = await supabase\n",
          )
          replace_once(
              "        content: reply,\n        cards: extras.cards ?? null,\n",
              "        content: safeReply,\n        cards: extras.cards ?? null,\n",
          )
          replace_once(
              "      reply,\n      cards: extras.cards,\n",
              "      reply: safeReply,\n      cards: extras.cards,\n",
          )

          replace_once(
              "    const summarizerSystem =\n      'You are Caye, summarising what you know about the operator\\'s business back to the operator. ' +\n",
              "    const summarizerSystem =\n      HUMAN_FACING_VOICE_INSTRUCTIONS + '\\n\\n' +\n      'You are Caye, summarising what you know about the operator\\'s business back to the operator. ' +\n",
          )

          path.write_text(s)
          PY
      - name: Commit dashboard boundary enforcement
        run: |
          rm .github/workflows/apply-voice-route-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/caye/chat/route.ts .github/workflows/apply-voice-route-patch.yml
          git commit -m "fix: sanitize dashboard human-facing output boundary"
          git push origin HEAD:fix/caye-communication-voice-architecture
