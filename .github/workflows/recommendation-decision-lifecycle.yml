name: Recommendation decision lifecycle

on:
  pull_request:
    paths:
      - 'lib/recommendations/decisions.ts'
      - 'lib/recommendations/decisions.test.ts'
      - 'supabase/migrations/20260901013000_durable_recommendation_decision_lifecycle.sql'
      - 'supabase/migrations/20260901013000_durable_recommendation_decision_lifecycle.test.ts'
      - '.github/workflows/recommendation-decision-lifecycle.yml'

permissions:
  contents: read
  issues: write

jobs:
  recommendation-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run recommendation decision tests
        run: npx vitest run lib/recommendations/decisions.test.ts supabase/migrations/20260901013000_durable_recommendation_decision_lifecycle.test.ts
      - name: Typecheck
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/typecheck.txt 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            {
              echo 'Temporary CI diagnostic for recommendation decision typecheck:'
              echo '```text'
              head -120 /tmp/typecheck.txt
              echo '```'
            } > /tmp/typecheck-comment.txt
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/typecheck-comment.txt
            cat /tmp/typecheck.txt
            exit "$status"
          fi
