name: PR426 remove dead fixture

on:
  push:
    branches:
      - integration/business-domain-bedrock-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/business-domain-bedrock-v1
      - name: Remove obsolete NormalizedDomainEvent field from PO E2E fixture
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/domain-integration/bedrock-purchase-order-e2e.test.ts')
          text = p.read_text()
          old = "      attentionEligible: true,\n"
          if old in text:
              text = text.replace(old, '', 1)
          elif 'attentionEligible' in text:
              raise SystemExit('unexpected attentionEligible shape remains')
          p.write_text(text)
      - name: Commit exact fixture cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/domain-integration/bedrock-purchase-order-e2e.test.ts
          git commit -m "test(domain): remove dead attention fixture field"
          git push
