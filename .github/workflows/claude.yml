name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    # Cost control: queue ordinary developer jobs instead of running a fleet of
    # broad repo investigations simultaneously. We can deliberately add more
    # parallelism later when usage headroom justifies it.
    concurrency:
      group: claude-sonnet-developer-${{ github.repository }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: |
            --model claude-sonnet-5
            --max-turns 80
            --allowedTools "Edit,Read,Write,Glob,Grep,Bash(npm ci),Bash(npm test *),Bash(npx vitest *),Bash(npm run build),Bash(npx tsc --noEmit),Bash(git status *),Bash(git diff *),Bash(git log *)"

          # Claude receives the triggering issue/comment from the action itself.
          # Permanent repo rules live in /CLAUDE.md. Product requirements should
          # be mirrored from the canonical Linear CAY-* issue into the GitHub
          # dispatch issue/comment so the runner never has to guess requirements
          # or rely on credentials that are not present in GitHub Actions.

      # The developer action used to end here, which meant a finished/failed job
      # had no machine-readable lifecycle state. This reconciler is deliberately
      # mechanical: it never reviews code, merges, deploys, touches Supabase, or
      # causes customer/operator side effects. It only records run state and, on
      # successful issue work, turns a pushed Claude branch into a reviewable PR.
      - name: Reconcile issue implementation state
        if: always() && github.event_name == 'issue_comment' && github.event.issue.pull_request == null
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -uo pipefail

          ensure_label() {
            local name="$1"
            local color="$2"
            local description="$3"
            gh api "repos/${REPO}/labels/${name}" >/dev/null 2>&1 || \
              gh api -X POST "repos/${REPO}/labels" \
                -f name="$name" -f color="$color" -f description="$description" >/dev/null
          }

          set_issue_state() {
            local add="$1"
            for old in claude-active claude-failed claude-ready-for-review claude-done; do
              if [[ "$old" != "$add" ]]; then
                gh api -X DELETE "repos/${REPO}/issues/${ISSUE_NUMBER}/labels/${old}" >/dev/null 2>&1 || true
              fi
            done
            gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/labels" -f "labels[]=$add" >/dev/null
          }

          ensure_label claude-active d4c5f9 "Claude implementation is currently active"
          ensure_label claude-failed d73a4a "Claude implementation failed or stopped before review-ready completion"
          ensure_label claude-ready-for-review 0e8a16 "Claude implementation produced a PR ready for controlled review"
          ensure_label claude-done 5319e7 "Claude implementation was merged through controlled review"
          ensure_label claude-queued 1d76db "Queued for serialized Claude implementation"

          # Branch names created by claude-code-action for issue work include the
          # issue number and a sortable timestamp. Pick the newest remote branch.
          BRANCH="$(gh api --paginate "repos/${REPO}/git/matching-refs/heads/claude/issue-${ISSUE_NUMBER}-" \
            --jq '.[].ref' 2>/dev/null | sed 's#refs/heads/##' | sort | tail -n 1)"

          AHEAD=0
          if [[ -n "${BRANCH}" ]]; then
            AHEAD="$(gh api "repos/${REPO}/compare/main...${BRANCH}" --jq '.ahead_by' 2>/dev/null || echo 0)"
          fi

          if [[ "${CLAUDE_OUTCOME}" != "success" ]]; then
            set_issue_state claude-failed
            gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
              -f body="<!-- caye-orchestrator:state=failed;run=${RUN_ID} -->
### Claude implementation stopped

- outcome: \`${CLAUDE_OUTCOME}\`
- saved branch: \`${BRANCH:-none}\`
- branch commits ahead of main: \`${AHEAD}\`
- run: ${RUN_URL}

No merge, deploy, production database change, or customer/operator side effect was attempted by the orchestrator. If a branch was saved, resume from that checkpoint rather than rediscovering the issue." >/dev/null
            exit 0
          fi

          if [[ -z "${BRANCH}" || "${AHEAD}" -le 0 ]]; then
            set_issue_state claude-failed
            gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
              -f body="<!-- caye-orchestrator:state=failed_no_branch;run=${RUN_ID} -->
### Claude reported success without saved implementation

No remote Claude branch with commits ahead of \`main\` was found for issue #${ISSUE_NUMBER}. Treating this as not review-ready rather than pretending the work exists.

Run: ${RUN_URL}" >/dev/null
            exit 0
          fi

          OWNER="${REPO%%/*}"
          PR_NUMBER="$(gh api "repos/${REPO}/pulls?state=open&head=${OWNER}:${BRANCH}" --jq '.[0].number // empty' 2>/dev/null)"

          if [[ -z "${PR_NUMBER}" ]]; then
            PR_JSON="$(gh api -X POST "repos/${REPO}/pulls" \
              -f title="Claude: ${ISSUE_TITLE}" \
              -f head="${BRANCH}" \
              -f base="main" \
              -f body="Implements #${ISSUE_NUMBER} for controlled product/safety review.

Generated by the Caye Claude orchestrator after the implementation job completed and saved commits to \`${BRANCH}\`.

The orchestrator does **not** merge, deploy, mutate production data, or perform customer/operator side effects." 2>/dev/null || true)"
            PR_NUMBER="$(printf '%s' "${PR_JSON}" | jq -r '.number // empty')"
          fi

          if [[ -z "${PR_NUMBER}" ]]; then
            set_issue_state claude-failed
            gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
              -f body="<!-- caye-orchestrator:state=branch_saved_pr_blocked;run=${RUN_ID} -->
### Claude implementation saved, PR creation blocked

- branch: \`${BRANCH}\`
- commits ahead of main: \`${AHEAD}\`
- run: ${RUN_URL}

The implementation is preserved, but GitHub did not allow the workflow token to create a PR. No merge/deploy/production mutation occurred." >/dev/null
            exit 0
          fi

          gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/labels" -f 'labels[]=claude-ready-for-review' >/dev/null
          set_issue_state claude-ready-for-review
          gh api -X POST "repos/${REPO}/issues/${ISSUE_NUMBER}/comments" \
            -f body="<!-- caye-orchestrator:state=ready_for_review;pr=${PR_NUMBER};run=${RUN_ID} -->
### Claude implementation ready for review

- PR: #${PR_NUMBER}
- branch: \`${BRANCH}\`
- commits ahead of main: \`${AHEAD}\`
- run: ${RUN_URL}

Waiting at the controlled review boundary. The orchestrator will not merge or deploy this PR." >/dev/null
