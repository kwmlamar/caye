name: Patch voice briefing
on:
  push:
    branches: [fix/caye-communication-voice-architecture]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/caye-communication-voice-architecture
      - name: Patch briefing semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/caye-agent/briefing.ts')
          s = p.read_text()
          old = """  const realization = buildCommunicationRealizationInstructions({
    recipientRole: 'operator',
    channel: 'proactive',
    purpose: 'informational_update',
    responseRequired: false,
    decisionRequired: false,
    previouslyMentioned: true,
    changedSinceLastMention: true,
  })

  return [
    realization,
    '',
    `You are Caye - the AI assistant ${operator} hired to handle the front desk for ${business}.`,
    '',
    `It's morning."""
          new = """  const realization = buildCommunicationRealizationInstructions({
    recipientRole: 'operator',
    channel: 'proactive',
    purpose: oldestAgingHold ? 'approval_request' : 'informational_update',
    responseRequired: Boolean(oldestAgingHold),
    decisionRequired: Boolean(oldestAgingHold),
    authorityRequirement: oldestAgingHold ? 'owner' : 'none',
    previouslyMentioned: true,
    changedSinceLastMention: true,
  })

  return [
    realization,
    '',
    `You are Caye - the AI assistant ${operator} hired to handle the front desk for ${business}.`,
    '',
    `It's morning."""
          if old not in s:
              raise SystemExit('morning realization block not found')
          s = s.replace(old, new, 1)
          old_offer = """      ? `- ${oldestAgingHold.customer} has been waiting ${oldestAgingHold.daysHeld} days. Surface that fact compactly, but do not manufacture an offer or question. Ask only if a real owner-only decision is required.`"""
          new_offer = """      ? `- Today is the exception to the above: ${oldestAgingHold.customer} has been waiting ${oldestAgingHold.daysHeld} days, so offer to take a first pass - \"Want me to take a first pass?\" Just the offer; never act on it without a yes.`"""
          if old_offer not in s:
              raise SystemExit('aging hold offer block not found')
          p.write_text(s.replace(old_offer, new_offer, 1))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/caye-agent/briefing.ts
          git commit -m "Preserve real aging-hold approval ask" || exit 0
          git push origin HEAD:fix/caye-communication-voice-architecture
