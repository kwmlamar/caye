name: Objective replanning CI

on:
  pull_request:
    paths:
      - 'lib/operator/objective-run.ts'
      - 'lib/operator/objective-run.test.ts'
      - 'lib/operator/objective-run-interruption.test.ts'
      - 'lib/operator/objective-store.ts'
      - 'lib/operator/objective-store-policy.test.ts'
      - 'lib/job-search/objective-operator.ts'
      - 'supabase/migrations/*objective*'
      - '.github/workflows/objective-replanning-ci.yml'
  push:
    branches:
      - 'chat4/durable-objective-replanning'

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test -- lib/operator/objective-run.test.ts lib/operator/objective-run-interruption.test.ts lib/operator/objective-store-policy.test.ts
