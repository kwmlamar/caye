name: Normalize voice boundary diff

on:
  push:
    branches:
      - fix/caye-communication-voice-architecture

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/caye-communication-voice-architecture
          fetch-depth: 0
      - name: Restore main files and apply surgical boundary changes
        run: |
          git checkout origin/main -- lib/email-ai.ts lib/whatsapp/channel-dispatch.ts
          python - <<'PY'
          from pathlib import Path

          def patch(path, replacements):
              p = Path(path)
              s = p.read_text()
              for old, new in replacements:
                  count = s.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match, got {count}: {old[:100]!r}')
                  s = s.replace(old, new, 1)
              p.write_text(s)

          patch('lib/email-ai.ts', [
              ("import { getZohoContext } from './zoho-token'\n", "import { getZohoContext } from './zoho-token'\nimport { sanitizeHumanFacingEmail } from './human-facing-email'\n"),
              ("  const { accountRow, accessToken, apiDomain, zohoAccountId } = await getZohoContext(workspaceId)\n  const base = mailBase(apiDomain)\n\n  const replyTargetId = await findReplyTargetZohoMessageId(workspaceId, threadId)\n", "  const clean = sanitizeHumanFacingEmail({ to, subject, body })\n  const { accountRow, accessToken, apiDomain, zohoAccountId } = await getZohoContext(workspaceId)\n  const base = mailBase(apiDomain)\n\n  const replyTargetId = await findReplyTargetZohoMessageId(workspaceId, threadId)\n"),
              ("    toAddress: to,\n    subject,\n    content: body,\n", "    toAddress: clean.to,\n    subject: clean.subject,\n    content: clean.body,\n"),
              ("    `[sendZohoReply] Sent to ${to}, threadId=${threadId}, ` +\n", "    `[sendZohoReply] Sent to ${clean.to}, threadId=${threadId}, ` +\n"),
              ("  const { accountRow, accessToken, apiDomain, zohoAccountId } = await getZohoContext(workspaceId)\n  const base = mailBase(apiDomain)\n\n  const res = await fetch(`${base}/api/accounts/${zohoAccountId}/messages`, {\n", "  const clean = sanitizeHumanFacingEmail({ to, subject, body })\n  const { accountRow, accessToken, apiDomain, zohoAccountId } = await getZohoContext(workspaceId)\n  const base = mailBase(apiDomain)\n\n  const res = await fetch(`${base}/api/accounts/${zohoAccountId}/messages`, {\n"),
              ("      toAddress: to,\n      subject,\n      content: body,\n", "      toAddress: clean.to,\n      subject: clean.subject,\n      content: clean.body,\n"),
              ("    `[sendZohoEmail] Sent to ${to}, subject=\"${subject}\", zohoMsgId=${data.data?.messageId ?? 'unknown'}`\n", "    `[sendZohoEmail] Sent to ${clean.to}, subject=\"${clean.subject}\", zohoMsgId=${data.data?.messageId ?? 'unknown'}`\n"),
              ("  const { accountRow, accessToken, apiDomain, zohoAccountId } = await getZohoContext(workspaceId)\n  const base = mailBase(apiDomain)\n\n  const replyTargetId = await findReplyTargetZohoMessageId(workspaceId, threadId)\n\n  const url = replyTargetId\n", "  const clean = sanitizeHumanFacingEmail({ to, subject, body })\n  const { accountRow, accessToken, apiDomain, zohoAccountId } = await getZohoContext(workspaceId)\n  const base = mailBase(apiDomain)\n\n  const replyTargetId = await findReplyTargetZohoMessageId(workspaceId, threadId)\n\n  const url = replyTargetId\n"),
              ("    `[createZohoReplyDraft] Drafted to ${to}, threadId=${threadId}, ` +\n", "    `[createZohoReplyDraft] Drafted to ${clean.to}, threadId=${threadId}, ` +\n"),
          ])

          # The request-body triplet in reply + draft is identical. At this point the
          # reply one is already replaced, so replace the one remaining draft copy.
          email = Path('lib/email-ai.ts')
          s = email.read_text()
          old = "    toAddress: to,\n    subject,\n    content: body,\n"
          if s.count(old) != 1:
              raise SystemExit(f'email draft body expected one remaining match, got {s.count(old)}')
          email.write_text(s.replace(old, "    toAddress: clean.to,\n    subject: clean.subject,\n    content: clean.body,\n", 1))

          patch('lib/whatsapp/channel-dispatch.ts', [
              ("import { recordSalesLifecycleEvent } from '@/lib/sales/lifecycle'\n", "import { recordSalesLifecycleEvent } from '@/lib/sales/lifecycle'\nimport { sanitizeHumanFacingText } from '@/lib/human-facing-voice'\n"),
              ("  const trimmed = text.trim()\n  if (!trimmed) throw new Error('empty reply')\n  let outboundBody = trimmed\n", "  const sanitizedText = sanitizeHumanFacingText(text)\n  if (!sanitizedText) throw new Error('empty reply')\n  let outboundBody = sanitizedText\n"),
              ("        await sendMetaMessage(conv.customer_id, trimmed, account.access_token)\n", "        await sendMetaMessage(conv.customer_id, outboundBody, account.access_token)\n"),
              ("          trimmed,\n          account.channel_account_id,\n", "          outboundBody,\n          account.channel_account_id,\n"),
              ("          const subject = (meta.subject as string) || 'Quick question'\n          const sent = await sendZohoEmail(conv.customer_id, subject, trimmed, account.user_id)\n", "          const subject = sanitizeHumanFacingText((meta.subject as string) || 'Quick question')\n          const sent = await sendZohoEmail(conv.customer_id, subject, outboundBody, account.user_id)\n"),
              ("        const subj = (meta.subject as string) || '(no subject)'\n", "        const subj = sanitizeHumanFacingText((meta.subject as string) || '(no subject)')\n"),
              ("        outboundBody = ensureTagline(\n          trimmed,\n          (workspaceRow?.ai_voice_profile ?? undefined) as VoiceProfile | undefined\n        )\n", "        outboundBody = sanitizeHumanFacingText(ensureTagline(\n          outboundBody,\n          (workspaceRow?.ai_voice_profile ?? undefined) as VoiceProfile | undefined\n        ))\n"),
          ])
          PY
      - name: Commit normalized diff
        run: |
          rm .github/workflows/normalize-voice-boundary-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/email-ai.ts lib/whatsapp/channel-dispatch.ts .github/workflows/normalize-voice-boundary-diff.yml
          git commit -m "refactor: preserve delivery boundary safety documentation"
          git push origin HEAD:fix/caye-communication-voice-architecture
