name: Normalize voice boundary diff

on:
  push:
    branches:
      - fix/caye-communication-voice-architecture

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/caye-communication-voice-architecture
          fetch-depth: 0
      - name: Restore main files and apply surgical boundary changes
        run: |
          git checkout origin/main -- lib/email-ai.ts lib/whatsapp/channel-dispatch.ts
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}: {old[:100]!r}')
              return text.replace(old, new, 1)

          email_path = Path('lib/email-ai.ts')
          email = email_path.read_text()
          email = replace_once(
              email,
              "import { getZohoContext } from './zoho-token'\n",
              "import { getZohoContext } from './zoho-token'\nimport { sanitizeHumanFacingEmail } from './human-facing-email'\n",
              'email import',
          )

          starts = {
              'reply': email.index('export async function sendZohoReply('),
              'send': email.index('export async function sendZohoEmail('),
              'draft': email.index('export async function createZohoReplyDraft('),
          }
          sections = {
              'prefix': email[:starts['reply']],
              'reply': email[starts['reply']:starts['send']],
              'send': email[starts['send']:starts['draft']],
              'draft': email[starts['draft']:],
          }

          for name in ('reply', 'send', 'draft'):
              sections[name] = replace_once(
                  sections[name],
                  "): Promise<{ " + ("draftId" if name == 'draft' else "messageId") + ": string | null }> {\n",
                  "): Promise<{ " + ("draftId" if name == 'draft' else "messageId") + ": string | null }> {\n  const clean = sanitizeHumanFacingEmail({ to, subject, body })\n",
                  f'{name} clean input',
              )
              sections[name] = replace_once(
                  sections[name],
                  'toAddress: to,',
                  'toAddress: clean.to,',
                  f'{name} toAddress',
              )
              sections[name] = replace_once(
                  sections[name],
                  'subject,\n',
                  'subject: clean.subject,\n',
                  f'{name} subject',
              )
              sections[name] = replace_once(
                  sections[name],
                  'content: body,',
                  'content: clean.body,',
                  f'{name} body',
              )

          sections['reply'] = replace_once(
              sections['reply'],
              '`[sendZohoReply] Sent to ${to}, threadId=${threadId}, `',
              '`[sendZohoReply] Sent to ${clean.to}, threadId=${threadId}, `',
              'reply log',
          )
          sections['send'] = replace_once(
              sections['send'],
              '`[sendZohoEmail] Sent to ${to}, subject="${subject}", zohoMsgId=${data.data?.messageId ?? \'unknown\'}`',
              '`[sendZohoEmail] Sent to ${clean.to}, subject="${clean.subject}", zohoMsgId=${data.data?.messageId ?? \'unknown\'}`',
              'send log',
          )
          sections['draft'] = replace_once(
              sections['draft'],
              '`[createZohoReplyDraft] Drafted to ${to}, threadId=${threadId}, `',
              '`[createZohoReplyDraft] Drafted to ${clean.to}, threadId=${threadId}, `',
              'draft log',
          )
          email_path.write_text(sections['prefix'] + sections['reply'] + sections['send'] + sections['draft'])

          dispatch_path = Path('lib/whatsapp/channel-dispatch.ts')
          dispatch = dispatch_path.read_text()
          replacements = [
              ("import { recordSalesLifecycleEvent } from '@/lib/sales/lifecycle'\n", "import { recordSalesLifecycleEvent } from '@/lib/sales/lifecycle'\nimport { sanitizeHumanFacingText } from '@/lib/human-facing-voice'\n", 'dispatch import'),
              ("  const trimmed = text.trim()\n  if (!trimmed) throw new Error('empty reply')\n  let outboundBody = trimmed\n", "  const sanitizedText = sanitizeHumanFacingText(text)\n  if (!sanitizedText) throw new Error('empty reply')\n  let outboundBody = sanitizedText\n", 'dispatch input'),
              ('await sendMetaMessage(conv.customer_id, trimmed, account.access_token)', 'await sendMetaMessage(conv.customer_id, outboundBody, account.access_token)', 'meta body'),
              ('          trimmed,\n          account.channel_account_id,', '          outboundBody,\n          account.channel_account_id,', 'whatsapp body'),
              ("          const subject = (meta.subject as string) || 'Quick question'\n          const sent = await sendZohoEmail(conv.customer_id, subject, trimmed, account.user_id)", "          const subject = sanitizeHumanFacingText((meta.subject as string) || 'Quick question')\n          const sent = await sendZohoEmail(conv.customer_id, subject, outboundBody, account.user_id)", 'first touch'),
              ("        const subj = (meta.subject as string) || '(no subject)'", "        const subj = sanitizeHumanFacingText((meta.subject as string) || '(no subject)')", 'reply subject'),
              ("        outboundBody = ensureTagline(\n          trimmed,\n          (workspaceRow?.ai_voice_profile ?? undefined) as VoiceProfile | undefined\n        )", "        outboundBody = sanitizeHumanFacingText(ensureTagline(\n          outboundBody,\n          (workspaceRow?.ai_voice_profile ?? undefined) as VoiceProfile | undefined\n        ))", 'tagline'),
          ]
          for old, new, label in replacements:
              dispatch = replace_once(dispatch, old, new, label)
          dispatch_path.write_text(dispatch)
          PY
      - name: Commit normalized diff
        run: |
          rm .github/workflows/normalize-voice-boundary-diff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/email-ai.ts lib/whatsapp/channel-dispatch.ts .github/workflows/normalize-voice-boundary-diff.yml
          git commit -m "refactor: preserve delivery boundary safety documentation"
          git push origin HEAD:fix/caye-communication-voice-architecture
