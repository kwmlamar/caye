name: PR426 surgical patch

on:
  push:
    branches:
      - integration/business-domain-bedrock-v1

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/business-domain-bedrock-v1
      - name: Patch existing PO E2E only
        shell: python
        run: |
          from pathlib import Path

          path = Path('lib/domain-integration/bedrock-purchase-order-e2e.test.ts')
          text = path.read_text()

          old_import = "import { PGlite } from '@electric-sql/pglite'\n"
          new_import = old_import + "import { isReportable } from '@/lib/caye-agent/workspace-feed'\n"
          if "@/lib/caye-agent/workspace-feed" not in text:
              if old_import not in text:
                  raise SystemExit('PGlite import anchor missing')
              text = text.replace(old_import, new_import, 1)

          old_assert = "    expect(rows[0].payload.attention_eligible).toBe(false)\n"
          new_assert = "    expect(isReportable({ actorKind: rows[0].actor_kind, isFailure: false })).toBe(false)\n"
          if old_assert in text:
              text = text.replace(old_assert, new_assert, 1)
          elif new_assert not in text:
              raise SystemExit('stale attention assertion anchor missing')

          old_migrations = "      '20260902000000_domain_change_source_snapshots.sql',\n    ])"
          new_migrations = "      '20260902000000_domain_change_source_snapshots.sql',\n      '20260902043000_domain_integration_review_fixes.sql',\n    ])"
          if "'20260902043000_domain_integration_review_fixes.sql'" not in text:
              if old_migrations not in text:
                  raise SystemExit('migration list anchor missing')
              text = text.replace(old_migrations, new_migrations, 1)

          path.write_text(text)
      - name: Commit exact test edits
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/domain-integration/bedrock-purchase-order-e2e.test.ts
          git commit -m "test(domain): run PO E2E against corrective schema"
          git push
