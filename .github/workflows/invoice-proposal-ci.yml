name: Grounded invoice proposal

on:
  pull_request:
    paths:
      - 'lib/invoice-proposal/**'
      - 'lib/freight/**'
      - 'lib/caye-agent/tools/read/propose-freight-invoice.ts'
      - 'lib/caye-agent/tools/read/propose-freight-invoice.test.ts'
      - 'lib/caye-agent/tools/registry.ts'
      - 'lib/caye-agent/tool-surface.test.ts'
      - '.github/workflows/invoice-proposal-ci.yml'
  push:
    branches:
      - agent/ods-grounded-invoice-proposal

jobs:
  invoice-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Invoice proposal, freight, and tool-surface tests
        run: >-
          npx vitest run
          lib/invoice-proposal/
          lib/freight/
          lib/caye-agent/tools/read/propose-freight-invoice.test.ts
          lib/caye-agent/tools/registry.test.ts
          lib/caye-agent/tool-surface.test.ts
      - name: Production build
        run: npm run build
      - name: TypeScript delta versus current main
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > /tmp/head-tsc.log 2>&1
          head_status=$?
          head_errors=$(grep -c 'error TS' /tmp/head-tsc.log || true)

          git checkout --detach origin/main
          npx tsc --noEmit > /tmp/main-tsc.log 2>&1
          main_status=$?
          main_errors=$(grep -c 'error TS' /tmp/main-tsc.log || true)

          echo "head_status=$head_status head_errors=$head_errors"
          echo "main_status=$main_status main_errors=$main_errors"
          echo '--- head TypeScript output ---'
          cat /tmp/head-tsc.log
          echo '--- main TypeScript output ---'
          cat /tmp/main-tsc.log

          if [ "$head_errors" -gt "$main_errors" ]; then
            echo "PR introduces additional TypeScript errors"
            exit 1
          fi
          if [ "$main_status" -eq 0 ] && [ "$head_status" -ne 0 ]; then
            echo "PR fails TypeScript while main passes"
            exit 1
          fi
          exit 0
