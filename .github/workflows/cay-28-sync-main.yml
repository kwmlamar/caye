name: CAY-28 reconcile latest main

on:
  push:
    branches:
      - cay-28-authority-routing-v2

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.head_commit.message == 'CAY-28 reconcile latest main before preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cay-28-authority-routing-v2
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "caye-wave2-bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/cay-28-sync-main.yml
          git add -A
          git commit -m "CAY-28 remove temporary main-sync workflow"
          git push origin HEAD:cay-28-authority-routing-v2
