name: PR426 final validation

on:
  push:
    branches:
      - integration/business-domain-bedrock-v1

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/business-domain-bedrock-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compare full-suite and TypeScript failure identities
        shell: bash
        run: |
          set +e
          REPORT=pr426-failure-diff.txt
          : > "$REPORT"
          echo "validated_head=$(git rev-parse HEAD)" >> "$REPORT"
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          echo "reviewed_head=9c2f746eb0406e3f586aa18cacad0a3fc38b2c98" >> "$REPORT"
          echo "main_head=$MAIN_SHA" >> "$REPORT"

          git worktree add --detach /tmp/pr426-reviewed 9c2f746eb0406e3f586aa18cacad0a3fc38b2c98
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/pr426-reviewed/node_modules
          git worktree add --detach /tmp/pr426-main "$MAIN_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/pr426-main/node_modules

          run_full() {
            label="$1"; dir="$2"; outfile="$3"
            (cd "$dir" && npx vitest run --reporter=json --outputFile="$outfile") >/tmp/full-${label}.log 2>&1
            echo "full_${label}_exit=$?" >> "$REPORT"
          }
          run_tsc() {
            label="$1"; dir="$2"
            (cd "$dir" && npx tsc --noEmit) >"/tmp/tsc-${label}.log" 2>&1
            echo "tsc_${label}_exit=$?" >> "$REPORT"
          }

          run_full current "$GITHUB_WORKSPACE" /tmp/full-current.json
          run_full reviewed /tmp/pr426-reviewed /tmp/full-reviewed.json
          run_full main /tmp/pr426-main /tmp/full-main.json
          run_tsc current "$GITHUB_WORKSPACE"
          run_tsc reviewed /tmp/pr426-reviewed
          run_tsc main /tmp/pr426-main

          node <<'NODE'
          const fs = require('fs')
          const path = require('path')
          const report = 'pr426-failure-diff.txt'
          const roots = {
            current: process.env.GITHUB_WORKSPACE,
            reviewed: '/tmp/pr426-reviewed',
            main: '/tmp/pr426-main',
          }
          function read(label) {
            const j = JSON.parse(fs.readFileSync(`/tmp/full-${label}.json`, 'utf8'))
            const failedFiles = new Set()
            const failedTests = new Set()
            for (const suite of j.testResults ?? []) {
              const file = path.relative(roots[label], suite.name).replaceAll('\\', '/')
              if (suite.status === 'failed') failedFiles.add(file)
              for (const a of suite.assertionResults ?? []) {
                if (a.status === 'failed') {
                  const name = a.fullName ?? [...(a.ancestorTitles ?? []), a.title].join(' > ')
                  failedTests.add(`${file} :: ${name}`)
                }
              }
            }
            return { j, failedFiles, failedTests }
          }
          function diff(a, b) { return [...a].filter(x => !b.has(x)).sort() }
          const cur = read('current'), rev = read('reviewed'), main = read('main')
          const lines = []
          for (const [label, r] of Object.entries({current: cur, reviewed: rev, main})) {
            lines.push(`full_${label}_failed_tests=${r.j.numFailedTests}`)
            lines.push(`full_${label}_failed_suites=${r.j.numFailedTestSuites}`)
            lines.push(`full_${label}_failed_file_identities=${r.failedFiles.size}`)
            lines.push(`full_${label}_failed_assertion_identities=${r.failedTests.size}`)
          }
          const newFilesVsReviewed = diff(cur.failedFiles, rev.failedFiles)
          const newFilesVsMain = diff(cur.failedFiles, main.failedFiles)
          const newTestsVsReviewed = diff(cur.failedTests, rev.failedTests)
          const newTestsVsMain = diff(cur.failedTests, main.failedTests)
          lines.push(`new_failed_files_vs_reviewed=${newFilesVsReviewed.length}`)
          lines.push(...newFilesVsReviewed.map(x => `NEW_FILE_VS_REVIEWED ${x}`))
          lines.push(`new_failed_files_vs_main=${newFilesVsMain.length}`)
          lines.push(...newFilesVsMain.map(x => `NEW_FILE_VS_MAIN ${x}`))
          lines.push(`new_failed_assertions_vs_reviewed=${newTestsVsReviewed.length}`)
          lines.push(...newTestsVsReviewed.map(x => `NEW_TEST_VS_REVIEWED ${x}`))
          lines.push(`new_failed_assertions_vs_main=${newTestsVsMain.length}`)
          lines.push(...newTestsVsMain.map(x => `NEW_TEST_VS_MAIN ${x}`))
          fs.appendFileSync(report, lines.join('\n') + '\n')
          NODE

          node <<'NODE'
          const fs = require('fs')
          const report = 'pr426-failure-diff.txt'
          function errs(label) {
            return new Set(fs.readFileSync(`/tmp/tsc-${label}.log`, 'utf8')
              .split(/\r?\n/)
              .filter(line => /error TS\d+:/.test(line)))
          }
          function diff(a,b) { return [...a].filter(x => !b.has(x)).sort() }
          const cur=errs('current'), rev=errs('reviewed'), main=errs('main')
          const nvr=diff(cur,rev), nvm=diff(cur,main)
          const lines=[
            `tsc_current_errors=${cur.size}`,
            `tsc_reviewed_errors=${rev.size}`,
            `tsc_main_errors=${main.size}`,
            `new_tsc_errors_vs_reviewed=${nvr.length}`,
            ...nvr.map(x=>`NEW_TSC_VS_REVIEWED ${x}`),
            `new_tsc_errors_vs_main=${nvm.length}`,
            ...nvm.map(x=>`NEW_TSC_VS_MAIN ${x}`),
          ]
          fs.appendFileSync(report, lines.join('\n')+'\n')
          NODE
      - name: Commit failure identity report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pr426-failure-diff.txt
          git commit -m "chore: record PR426 failure identity diff"
          git push
