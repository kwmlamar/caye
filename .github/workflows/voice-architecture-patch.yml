name: Voice architecture one-shot patch

on:
  push:
    branches:
      - fix/caye-communication-voice-architecture

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/caye-communication-voice-architecture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply semantic realization wiring
        run: python scripts/voice-realization-patch.py
      - name: Commit patched generation paths
        run: |
          if git diff --quiet -- app/api/caye/chat/route.ts lib/caye-agent/briefing.ts; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/caye/chat/route.ts lib/caye-agent/briefing.ts
          git diff --cached --check
          git commit -m "Wire semantic communication realization into operator paths"
          git push origin HEAD:fix/caye-communication-voice-architecture
