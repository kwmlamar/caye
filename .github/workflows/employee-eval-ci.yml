name: Caye Employee Eval

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'lib/caye-employee-eval/**'
      - 'lib/business-learning/**'
      - 'supabase/migrations/**'
      - 'scripts/caye-employee-eval*.mjs'
      - '.github/workflows/employee-eval-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  employee-eval:
    name: Employee Eval v1 gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Record exact candidate revision
        id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build exact candidate implementation
        run: npm run build

      - name: Evaluator regression tests
        run: npx vitest run lib/caye-employee-eval/evaluator.test.ts lib/caye-employee-eval/cli-runner.test.ts --reporter=verbose

      - name: Production adapter regression tests
        env:
          CAYE_EMPLOYEE_CODE_REVISION: ${{ steps.revision.outputs.sha }}
          CAYE_EMPLOYEE_EVAL_RUNTIME: '1'
        run: npx vitest run lib/caye-employee-eval/production-adapter.test.ts --reporter=verbose

      - name: Determine whether PR touches employee behavior
        id: scope
        if: github.event_name == 'pull_request'
        env:
          CAYE_EMPLOYEE_EVAL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CAYE_EMPLOYEE_EVAL_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/caye-employee-eval-pr-scope.mjs

      - name: Run frozen Employee Eval v1 against exact candidate implementation
        env:
          CAYE_EMPLOYEE_CODE_REVISION: ${{ steps.revision.outputs.sha }}
          CAYE_EMPLOYEE_EVAL_RUNTIME: '1'
        run: npx vitest run lib/caye-employee-eval/candidate-runner.test.ts --reporter=verbose

      - name: Compare candidate score against frozen v1 baseline
        run: npm run caye:employee:eval -- --candidate=lib/caye-employee-eval/__output__/candidate-report.json

      - name: Report score delta and hard-failure changes
        if: always()
        run: |
          if [ -s lib/caye-employee-eval/__output__/candidate-comparison.md ]; then
            cat lib/caye-employee-eval/__output__/candidate-comparison.md >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "Employee Eval v1 comparison:"
            cat lib/caye-employee-eval/__output__/candidate-comparison.md
          else
            echo "## Caye Employee Eval Comparison" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**UNEVALUABLE:** the exact candidate did not produce a candidate comparison." >> "$GITHUB_STEP_SUMMARY"
            echo "Employee Eval candidate comparison missing; the gate fails closed." >&2
            exit 1
          fi

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caye-employee-eval-${{ github.run_id }}-${{ steps.revision.outputs.sha }}
          path: lib/caye-employee-eval/__output__/
          if-no-files-found: warn
